[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "frank-executor"
version = "0.1.0"
description = "Frank's transport-neutral runtime executor and integration adapters"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.28,<0.29", "jsonschema>=4.23,<5", "process-runtime==0.1.0"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
frank-executor = "frank_executor.cli:main"
frank-local-review = "frank_executor.local_review_cli:main"
frank-workspace = "frank_executor.workspace_cli:main"
frank-review-packet = "frank_review_adapter.packet_reader:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.data-files]
"share/frank-executor/contracts" = ["contracts/integration-adapter-v1.schema.json", "contracts/runtime-v1.schema.json", "contracts/native-result-authority-v1.schema.json", "contracts/connector-result-selector-v1.schema.json"]
"share/frank-executor/contracts/fixtures" = ["contracts/fixtures/work.v1.json", "contracts/fixtures/result.v1.json"]
"share/frank-executor/examples" = ["examples/frank.local.json", "examples/frank.production.json", "examples/hermes.live-provider-pilot.json"]
