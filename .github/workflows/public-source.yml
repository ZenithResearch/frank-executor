name: Public source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ZenithResearch/process-runtime
          ref: dd6b13d918c9d89228e0d618bd67f8c382d68492
          path: runtime-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.12'
      - run: python -m pip install --require-hashes -r runtime-source/requirements-ci.lock
      - run: python -m pip install --no-deps --no-build-isolation ./runtime-source .
      - run: python -m pip install 'httpx==0.28.1' 'pytest==9.1.1'
      - name: Build pinned verification-only Native helper
        run: cargo build --locked --release --manifest-path runtime-source/native/secs-verifier/Cargo.toml
      - name: Full executor and actual Native verification suite
        shell: bash
        run: |
          export FRANK_NATIVE_VERIFIER="$GITHUB_WORKSPACE/runtime-source/native/secs-verifier/target/release/process-runtime-secs-verifier"
          export FRANK_NATIVE_VERIFIER_SHA256="$(sha256sum "$FRANK_NATIVE_VERIFIER" | cut -d ' ' -f 1)"
          PYTHONPATH=src python -m pytest -q --basetemp="$RUNNER_TEMP/frank-tests"
